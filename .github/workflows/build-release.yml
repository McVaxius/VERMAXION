name: Build and Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PLUGIN_NAME: VERMAXION
  SOLUTION_NAME: VERMAXION
  INTERNAL_NAME: VERMAXION
  RELEASE_DIR: VERMAXION\bin\x64\Release\VERMAXION

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          $devPath = Join-Path $env:AppData "XIVLauncher\addon\Hooks\dev"
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/goatcorp/dalamud-distrib/4b9175ec411f15a84f4d59dc24881095aef2d999/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $devPath
          Write-Host "Expected pinned Dalamud: version 15.0.2.2, GitSha 4a6abae25b8a156a102ed3869429ef026a3d7cfe, revision 7312"
          foreach ($metadataFile in @("commit_hash.txt", "revision.txt")) {
            $metadataPath = Join-Path $devPath $metadataFile
            if (Test-Path $metadataPath) {
              Write-Host "${metadataFile}: $((Get-Content -Raw $metadataPath).Trim())"
            } else {
              Write-Warning "${metadataFile} was not found in $devPath"
            }
          }

      - name: Build
        run: |
          dotnet restore -r win ${{ env.SOLUTION_NAME }}.sln
          dotnet build ${{ env.SOLUTION_NAME }}.sln --configuration Release -p:Platform=x64
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: |
            ${{ env.RELEASE_DIR }}\latest.zip
            ${{ env.RELEASE_DIR }}\${{ env.INTERNAL_NAME }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: artifact

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=v0.3.3.0" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifact/latest.zip
            artifact/${{ env.INTERNAL_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

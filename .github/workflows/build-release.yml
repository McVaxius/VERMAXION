name: Build and Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PLUGIN_NAME: VERMAXION
  INTERNAL_NAME: VERMAXION
  RELEASE_DIR: VERMAXION\VERMAXION\bin\x64\Release\VERMAXION

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        working-directory: VERMAXION
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: VERMAXION
          submodules: recursive
          persist-credentials: false

      - name: Checkout AethertekUI
        uses: actions/checkout@v4
        with:
          repository: McVaxius/aethertekUI
          # Publish compatible library APIs before consumer changes.
          ref: 0c1b0e488183b51507b2715eff8dc5b957d4829a
          path: aethertekUI
          # Repository-specific read-only SSH deploy key; no expiration.
          ssh-key: ${{ secrets.AETHERTEKUI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"

      - name: Download Dalamud
        run: |
          $devPath = Join-Path $env:AppData "XIVLauncher\addon\Hooks\dev"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $devPath
          foreach ($metadataFile in @("commit_hash.txt", "revision.txt")) {
            $metadataPath = Join-Path $devPath $metadataFile
            if (Test-Path $metadataPath) {
              Write-Host "${metadataFile}: $((Get-Content -Raw $metadataPath).Trim())"
            } else {
              Write-Warning "${metadataFile} was not found in $devPath"
            }
          }

      - name: Build
        run: |
          $dalamudLibPath = "$env:AppData/XIVLauncher/addon/Hooks/dev"
          dotnet restore VERMAXION/VERMAXION.csproj -p:Configuration=Release -p:Platform=x64 -p:DalamudLibPath="$dalamudLibPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build VERMAXION/VERMAXION.csproj --configuration Release -p:Platform=x64 --no-restore -p:DalamudLibPath="$dalamudLibPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: |
            ${{ env.RELEASE_DIR }}\latest.zip
            ${{ env.RELEASE_DIR }}\${{ env.INTERNAL_NAME }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: artifact

      - name: Determine Release Version
        id: get_version
        shell: bash
        env:
          INTERNAL_NAME: ${{ env.INTERNAL_NAME }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version="$(python3 -c "import json, os; from pathlib import Path; manifest_path = Path('artifact') / f\"{os.environ['INTERNAL_NAME']}.json\"; manifest = json.loads(manifest_path.read_text(encoding='utf-8')); manifest = manifest[0] if isinstance(manifest, list) else manifest; print(f\"v{manifest['AssemblyVersion']}\")")"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Canonical Release Notes
        id: release_notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8-sig").splitlines(keepends=True)
          heading = re.compile(r"^\d{4}-\d{2}-\d{2} - " + re.escape(version) + r"(?: - |$)")
          matches = [index for index, line in enumerate(lines) if heading.match(line)]
          if len(matches) != 1:
              raise SystemExit(f"Expected one dated canonical changelog entry for {version}.")
          start = matches[0]
          end = next((index for index in range(start + 1, len(lines))
                      if re.match(r"^(?:\d{4}-\d{2}-\d{2}|Unreleased) - ", lines[index])), len(lines))
          body = "".join(lines[start:end]).strip()
          if not any(line.startswith("- ") for line in lines[start + 1:end]):
              raise SystemExit(f"Canonical changelog entry for {version} has no release bullets.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("body<<VERMAXION_RELEASE_BODY\n" + body + "\nVERMAXION_RELEASE_BODY\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            artifact/latest.zip
            artifact/${{ env.INTERNAL_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
